<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>customer</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="../public/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="container-fluid min-vh-100 d-flex flex-column p-0">
        
        <div class="row g-0 flex-grow-1">
            
            <div class="col-lg-6 bg-login-image d-none d-lg-flex align-items-center justify-content-center position-relative">
                
                <div class="text-center">
                        <img src="../public/img/3D_money_bag.png" class="img-fluid login-3d-img animation-float" alt="3D money bag">
                </div>

            </div>

           <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white py-5 px-5">
    
    <div class="w-100" style="max-width: 520px;"> 
        <h1 class="fw-bold text-teal mb-2">MoneyKeeper</h1>
        <p class="text-secondary fs-5 mb-5">Welcome Back!</p>

        <form action="">
            <div class="form-floating mb-3">
                <input type="email" class="form-control rounded-3" id="floatingInput" required placeholder="name@example.com">
                <label for="floatingInput" class="text-muted">Tên đăng nhập</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control rounded-3" id="floatingPassword" required placeholder="Password">
                <label for="floatingPassword" class="text-muted">Mật khẩu</label>
            </div>

            <div class="d-flex justify-content-end mb-4">
                <a href="#" class="text-decoration-none text-teal small fw-bold">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-3 rounded-pill fw-bold text-white">
                Đăng nhập
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small">
                Nếu bạn không có tài khoản? 
                <a href="register.html" class="text-teal fw-bold text-decoration-none">Đăng ký</a>
            </p>
        </div>

    </div>
</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
